name: windows-x64-ci

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-gemini35-proxy-upgrade.py
      - scripts/apply-ptt-fast-commit.py
      - .github/workflows/windows-x64-ci.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Gemini 3.5 and proxy source migration
        shell: pwsh
        run: python scripts/apply-gemini35-proxy-upgrade.py

      - name: Apply PTT release-to-commit migration
        shell: pwsh
        run: python scripts/apply-ptt-fast-commit.py

      - name: Commit generated source changes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src src-tauri package.json
            git commit -m "feat: commit PTT transcript immediately on hotkey release"
            git push origin HEAD:main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install Rust stable x64 MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare CMake wrapper
        shell: pwsh
        run: |
          $cmake = (Get-Command cmake -ErrorAction Stop).Source
          $wrapper = Join-Path $PWD 'cmake-wrap.cmd'
          @"
          @echo off
          setlocal
          echo %* | findstr /C:"--build" >nul
          if %errorlevel%==0 (
            "$cmake" %*
          ) else (
            "$cmake" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 %*
          )
          "@ | Set-Content -Path $wrapper -Encoding ASCII
          "CMAKE=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile all Rust tests
        working-directory: src-tauri
        run: cargo test --no-run --target x86_64-pc-windows-msvc

      - name: Run PTT fast-commit state-machine tests
        working-directory: src-tauri
        run: cargo test --target x86_64-pc-windows-msvc ptt_ -- --nocapture

      - name: Commit Cargo.lock update
        shell: bash
        run: |
          if ! git diff --quiet -- src-tauri/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/Cargo.lock
            git commit -m "build: update Cargo lockfile for v0.14.1"
            git push origin HEAD:main
          fi

      - name: Build Windows x64 bundles
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows x64 installers
        uses: actions/upload-artifact@v4
        with:
          name: VoiceX-v0.14.1-ptt-fast-commit-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Archive successful installers in repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'release-builds/v0.14.1-ptt-fast-commit'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Remove-Item "$releaseDir/*.exe", "$releaseDir/*.msi" -Force -ErrorAction SilentlyContinue

          $msi = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi'
          $exe = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe'
          if (-not $msi -or -not $exe) { throw 'Expected MSI and EXE bundles were not produced' }
          Copy-Item $msi.FullName -Destination $releaseDir -Force
          Copy-Item $exe.FullName -Destination $releaseDir -Force

          $sourceSha = (git rev-parse HEAD).Trim()
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          @"
          # VoiceX v0.14.1 PTT Fast Commit

          - Version: `0.14.1`
          - Platform: `Windows x64 (x86_64-pc-windows-msvc)`
          - Source commit: `$sourceSha`
          - Successful CI run: $runUrl

          ## Main changes

          - Push-To-Talk key release is an explicit commit signal.
          - Existing provider final text is preferred; otherwise the latest HUD/interim transcript is committed.
          - Empty PTT snapshots are not injected.
          - Late ASR final/partial/failure/finished messages are ignored after a PTT release commit, preventing duplicate input.
          - Hands-Free keeps its existing ASR completion behavior.
          - Gemini 3.5 transcription, Google Cloud STT, proxy transport, local ASR, and the existing text-injection pipeline remain enabled.
          "@ | Set-Content -Path "$releaseDir/BUILD_INFO.md" -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $releaseDir
          git commit -m "build: archive VoiceX v0.14.1 PTT Windows x64 installers [skip ci]"
          git push origin HEAD:main
