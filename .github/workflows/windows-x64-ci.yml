name: windows-x64-ci

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-global-network-proxy.py
      - scripts/test-global-network-proxy.py
      - .github/workflows/windows-x64-ci.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global network proxy migration
        shell: pwsh
        run: python scripts/apply-global-network-proxy.py

      - name: Commit generated source changes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src src-tauri
            git commit -m "feat: add global network proxy modes"
            git push origin HEAD:main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install Rust stable x64 MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build frontend
        run: pnpm build

      - name: Run global proxy contract checks
        shell: pwsh
        run: python scripts/test-global-network-proxy.py

      - name: Run PTT fast-commit state-machine regression tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target | Out-Null
          rustc --edition=2021 --target x86_64-pc-windows-msvc --test src/ptt_commit.rs -o target/ptt-commit-tests.exe
          & .\target\ptt-commit-tests.exe --nocapture

      - name: Prepare CMake wrapper
        shell: pwsh
        run: |
          $cmake = (Get-Command cmake -ErrorAction Stop).Source
          $wrapper = Join-Path $PWD 'cmake-wrap.cmd'
          @"
          @echo off
          setlocal
          echo %* | findstr /C:"--build" >nul
          if %errorlevel%==0 (
            "$cmake" %*
          ) else (
            "$cmake" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 %*
          )
          "@ | Set-Content -Path $wrapper -Encoding ASCII
          "CMAKE=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile all Rust tests
        working-directory: src-tauri
        run: cargo test --no-run --target x86_64-pc-windows-msvc

      - name: Commit Cargo.lock update
        shell: bash
        run: |
          if ! git diff --quiet -- src-tauri/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/Cargo.lock
            git commit -m "build: update Cargo lockfile for global network proxy"
            git push origin HEAD:main
          fi

      - name: Build Windows x64 bundles
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows x64 installers
        uses: actions/upload-artifact@v4
        with:
          name: VoiceX-v0.14.1-global-network-proxy-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Archive successful installers in repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'release-builds/v0.14.1-global-network-proxy'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Remove-Item "$releaseDir/*.exe", "$releaseDir/*.msi" -Force -ErrorAction SilentlyContinue

          $msi = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi'
          $exe = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe'
          if (-not $msi -or -not $exe) { throw 'Expected MSI and EXE bundles were not produced' }
          Copy-Item $msi.FullName -Destination $releaseDir -Force
          Copy-Item $exe.FullName -Destination $releaseDir -Force

          $sourceSha = (git rev-parse HEAD).Trim()
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $buildInfo = @(
            '# VoiceX v0.14.1 Global Network Proxy',
            '',
            '- Version: 0.14.1',
            '- Platform: Windows x64 (x86_64-pc-windows-msvc)',
            "- Source commit: $sourceSha",
            "- Successful CI run: $runUrl",
            '',
            '## Main changes',
            '',
            '- Proxy settings moved out of ASR into the global Network settings page.',
            '- Explicit No proxy, System proxy, and Custom proxy modes.',
            '- Legacy explicit proxy URLs migrate to Custom mode without losing the saved URL.',
            '- System mode reads the current Windows user proxy configuration for new connections.',
            '- Direct mode explicitly bypasses system/environment proxy discovery.',
            '- Gemini Live WebSocket and Google Cloud STT / Chirp 3 OAuth and gRPC share the same global proxy configuration.',
            '- Local ASR remains independent of the global network proxy.',
            '- Existing PTT release-to-commit source is unchanged and its standalone regression tests still pass.',
            '',
            '## Validation',
            '',
            '- Vue/TypeScript frontend type-check and Vite production build completed successfully.',
            '- Global proxy persistence, UI placement, Windows proxy wiring, and cloud transport contract checks executed successfully.',
            '- VoiceX Rust test targets, including the network proxy unit tests, compiled successfully with cargo test --no-run.',
            '- Standalone pure-Rust PTT state-machine regression tests executed successfully on Windows x64.',
            '- Tauri Windows x64 MSI and NSIS bundles built successfully.',
            '',
            'Note: the full VoiceX lib-test executable is not launched in CI because the repository native test binary currently fails at process startup with STATUS_ENTRYPOINT_NOT_FOUND before Rust tests run; compilation still covers those tests.'
          ) -join "`n"
          Set-Content -Path "$releaseDir/BUILD_INFO.md" -Value $buildInfo -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $releaseDir
          git commit -m "build: archive VoiceX v0.14.1 global proxy Windows x64 installers [skip ci]"
          git push origin HEAD:main
